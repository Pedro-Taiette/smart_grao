# SmartGrão inteiro em containers, com os dados da demonstração.
#
#   docker compose up -d --build     (ou dois cliques em demo.cmd)
#   http://localhost:8080
#
# Banco local com uma cópia congelada da demo: nada aqui mexe no banco compartilhado (Neon). Para
# voltar ao estado inicial, `docker compose down -v` (ou demo-reset.cmd). Ver docs/docker.md.
name: smartgrao

services:
  db:
    build: { context: ., dockerfile: docker/db.Dockerfile }
    environment:
      POSTGRES_USER: smartgrao
      POSTGRES_PASSWORD: smartgrao
      POSTGRES_DB: smartgrao
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Por TCP: durante a carga inicial o Postgres so escuta no socket local, e a API nao pode
      # entrar antes de a demo estar no banco.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartgrao -d smartgrao"]
      interval: 3s
      timeout: 3s
      retries: 60

  analytics:
    build: { context: ., dockerfile: docker/analytics.Dockerfile }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      ConnectionStrings__SmartGrao: "Host=db;Database=smartgrao;Username=smartgrao;Password=smartgrao"
      Analytics__BaseUrl: "http://analytics:8000/"
    volumes:
      - photos:/data/photos
    depends_on:
      db: { condition: service_healthy }
      analytics: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  photos:
